<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&amp;display=block');</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d6dff"/>
      <stop offset="0.55" stop-color="#3358ff"/>
      <stop offset="1" stop-color="#1b34b8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb0ff"/>
      <stop offset="0.45" stop-color="#3358ff"/>
      <stop offset="0.5" stop-color="#1b34b8"/>
      <stop offset="1" stop-color="#5a7cff"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f45"/>
      <stop offset="1" stop-color="#151827"/>
    </linearGradient>
    <clipPath id="round"><rect x="40" y="40" width="1000" height="1000" rx="200"/></clipPath>
    <clipPath id="bar"><rect x="0" y="0" width="560" height="96" rx="18"/></clipPath>
    <!-- black and white clapper stripes -->
    <g id="stripes">
      <rect x="0" y="0" width="560" height="96" fill="#ffffff"/>
      <g fill="#151827">
        <path d="M20 0 H100 L60 96 H-20 Z"/>
        <path d="M180 0 H260 L220 96 H140 Z"/>
        <path d="M340 0 H420 L380 96 H300 Z"/>
        <path d="M500 0 H580 L540 96 H460 Z"/>
      </g>
    </g>
  </defs>

  <!-- tile -->
  <rect x="40" y="40" width="1000" height="1000" rx="200" fill="url(#bg)"/>
  <rect x="40" y="40" width="1000" height="1000" rx="200" fill="url(#glow)"/>
  <g clip-path="url(#round)">
    <rect x="40" y="40" width="1000" height="520" fill="url(#sheen)"/>
  </g>

  <!-- clapperboard, tilted a little like it's being snapped shut -->
  <g transform="translate(540 540) scale(0.84) translate(-540 -480) rotate(-6 540 480)">
    <!-- slate body -->
    <rect x="260" y="360" width="560" height="380" rx="30" fill="url(#slate)" stroke="#ffffff" stroke-width="18"/>
    <!-- fixed stripe bar -->
    <g transform="translate(260 300)">
      <g clip-path="url(#bar)"><use href="#stripes"/></g>
      <rect x="0" y="0" width="560" height="96" rx="18" fill="none" stroke="#ffffff" stroke-width="18"/>
    </g>
    <!-- clapper arm, swung open on its hinge -->
    <g transform="rotate(-18 272 300) translate(260 196)">
      <g clip-path="url(#bar)"><use href="#stripes"/></g>
      <rect x="0" y="0" width="560" height="96" rx="18" fill="none" stroke="#ffffff" stroke-width="18"/>
    </g>
    <circle cx="282" cy="298" r="22" fill="#ffffff"/>
    <!-- slate lines -->
    <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round">
      <line x1="300" y1="660" x2="780" y2="660"/>
      <line x1="540" y1="660" x2="540" y2="712"/>
    </g>
    <!-- CUT! -->
    <g font-family="'Luckiest Guy', Impact, sans-serif" font-size="210" text-anchor="middle" stroke-linejoin="round">
      <text x="540" y="630" fill="none" stroke="#0d1b5e" stroke-width="30">CUT!</text>
      <text x="540" y="630" fill="#ffd23f" stroke="#ffffff" stroke-width="10" paint-order="stroke">CUT!</text>
    </g>
  </g>

  <!-- snap lines off the clapper tip -->
  <g stroke="#ffffff" stroke-width="20" stroke-linecap="round">
    <line x1="800" y1="190" x2="846" y2="148"/>
    <line x1="820" y1="262" x2="890" y2="248"/>
    <line x1="738" y1="160" x2="748" y2="110"/>
  </g>

  <!-- outline -->
  <rect x="40" y="40" width="1000" height="1000" rx="200" fill="none" stroke="#ffffff" stroke-width="22"/>
  <rect x="61" y="61" width="958" height="958" rx="180" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>

  <!-- name -->
  <g font-family="'Luckiest Guy', Impact, sans-serif" font-size="148" text-anchor="middle" stroke-linejoin="round">
    <text x="540" y="930" transform="rotate(-3 540 930)" fill="none" stroke="#0d1b5e" stroke-width="34">FLASHBACK</text>
    <text x="540" y="930" transform="rotate(-3 540 930)" fill="#ffffff" stroke="url(#rim)" stroke-width="22" paint-order="stroke">FLASHBACK</text>
  </g>
</svg>
